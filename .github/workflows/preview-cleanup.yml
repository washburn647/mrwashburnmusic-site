# Deletes Cloudflare Previews that are no longer needed.
# Every branch Preview gets its own copy of the Worker's three Durable Object namespaces, and
# the free plan allows 100 in all, so Previews left behind soon stop new ones from building.
#
# - When a pull request closes (merged or not), its branch's Preview is deleted.
# - Run it by hand (Actions > Delete previews > Run workflow) with a branch name to delete that
#   one Preview, or with the name left empty to delete the Preview of every branch that has no
#   open pull request (main's own deployment is never touched).
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare
# Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Delete previews

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      name:
        description: Branch whose Preview to delete (leave empty for every branch with no open pull request)
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  delete:
    # Only for branches in this repository: forks never get the secrets.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      INPUT_NAME: ${{ github.event.inputs.name }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete the Previews
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID aren't set, so no Preview was deleted."
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            branches="$PR_BRANCH"
          elif [ -n "$INPUT_NAME" ]; then
            branches="$INPUT_NAME"
          else
            open="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref')"
            branches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' \
              | grep -vx main | grep -vxF -f <(printf '%s\n' "$open") || true)"
          fi
          npm install --no-save --silent wrangler@4
          for b in $branches; do
            [ "$b" = main ] && continue
            # Workers Builds names a Preview after its branch; the dashboard shows it with / as -.
            slug="$(printf '%s' "$b" | tr '/_.' '---' | tr '[:upper:]' '[:lower:]')"
            if npx wrangler preview delete --name "$b" --skip-confirmation \
              || npx wrangler preview delete --name "$slug" --skip-confirmation; then
              echo "Deleted the Preview for $b"
            else
              echo "::notice::No Preview for $b (it may never have been built, or was already deleted)."
            fi
          done
