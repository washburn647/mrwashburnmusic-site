<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sub plans · Mr. Washburn Music</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/class/class.css">
  <script type="module" src="sub.js"></script>
</head>
<body class="sub-page">
  <main class="sub-card">
    <img class="sub-logo" src="/assets/logo/option-f-notes-badge.svg" alt="Mr. Washburn Music">
    <form id="open" class="sub-open">
      <input id="code" name="code" placeholder="Code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" required>
      <button class="btn">Open</button>
    </form>
    <div id="ready" class="sub-ready" hidden>
      <h1 id="name"></h1>
      <button class="btn" id="go">▶ Present</button>
      <div id="grades" class="sub-pick-grades" hidden></div>
    </div>
    <p id="msg" class="sub-note" role="status"></p>
  </main>
</body>
</html>
