<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio · Mr. Washburn Music</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Fredoka"; src: url("/assets/fonts/fredoka-latin.woff2") format("woff2"); font-weight: 400 600; }
    body { margin: 0; min-height: 100vh; background: #F6F1E4; color: #2F4A3A; font-family: "Fredoka", system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    header { display: flex; align-items: center; gap: 14px; }
    header img { width: 56px; height: 56px; }
    h1 { font-weight: 600; margin: 0; }
    h2 { font-weight: 500; font-size: 15px; color: #5B6B5F; text-transform: uppercase; letter-spacing: .06em; margin: 32px 0 10px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    a, .soon { display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; background: #fff; border-radius: 16px; padding: 12px 16px; color: inherit; text-decoration: none; font-size: 18px; font-weight: 500; box-shadow: 0 2px 0 rgba(47,74,58,.08); }
    a:hover, a:focus-visible { box-shadow: 0 0 0 3px #2F4A3A; outline: none; }
    a img { width: 40px; height: 40px; border-radius: 10px; }
    .soon { color: #8A968C; background: transparent; box-shadow: inset 0 0 0 2px #E4DCC8; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/assets/logo/option-f-notes-badge-icon.svg" alt="">
      <h1>Studio</h1>
    </header>

    <h2>Apps</h2>
    <ul>
      <li><a href="/class/"><img src="/class/icons/icon-192.png" alt="">Class</a></li>
      <li><a href="/class/#/plan"><img src="/class/icons/icon-192.png" alt="">Planner</a></li>
      <li><a href="/songburner/"><img src="/songburner/icons/icon-192.png" alt="">Song Burner</a></li>
    </ul>

    <h2>Tools</h2>
    <ul>
      <li><a href="/studio/cues/">Video cue sheets</a></li>
      <li><a href="/studio/lessons/">Lesson pages</a></li>
      <li><span class="soon">Game workshop</span></li>
    </ul>
  </main>
</body>
</html>
