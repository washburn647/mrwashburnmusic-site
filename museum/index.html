<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Instrument Museum · Mr. Washburn Music</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1F3329">
  <link rel="stylesheet" href="museum.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="hall" class="hall">
    <header class="hall-top">
      <a class="home" href="../" aria-label="Mr. Washburn Music"><img src="../assets/logo/option-f-notes-badge-icon.svg" alt=""></a>
      <h1>Instrument Museum</h1>
      <p class="tagline">Walk the rooms. Play everything.</p>
    </header>
    <section class="welcome" aria-label="Your visit">
      <div class="ticket" id="ticket"></div>
      <div class="passport" id="passport"></div>
    </section>
    <nav class="families" id="families" aria-label="Compare a family side by side"></nav>
    <main id="plan" class="plan" aria-label="Floor plan: tap an instrument to play it, or a room’s sign to walk through it"></main>
  </div>

  <div id="gallery" class="gallery" hidden>
    <header class="bar">
      <a class="back" href="#" aria-label="Back to the floor plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h2 id="gal-name"></h2>
      <nav class="mini" id="gal-map" aria-label="Rooms"></nav>
    </header>
    <div class="room-body">
      <div class="walkwrap">
        <div class="walk" id="walk"><div class="track" id="track"></div></div>
        <button class="stepper prev" id="gal-prev" aria-label="Walk left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="stepper next" id="gal-next" aria-label="Walk right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <section class="docent" id="docent" aria-live="polite" hidden></section>
    </div>
  </div>

  <div id="quiz" class="quizview" hidden>
    <header class="bar">
      <a class="back" href="#" aria-label="Back to the museum"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h2>Museum quiz</h2>
      <ol class="dots" id="quiz-dots" aria-label="Questions"></ol>
    </header>
    <div class="quiz-main" id="quiz-main"></div>
  </div>

  <div id="compare" class="compareview" hidden>
    <header class="bar">
      <a class="back" href="#" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h2 id="cmp-name"></h2>
    </header>
    <main class="cmp-main" id="cmp-main"></main>
  </div>

  <div id="exhibit" class="exhibit" hidden>
    <header class="bar">
      <a class="back" href="#" aria-label="Back to the museum"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h2 id="ex-name"></h2>
      <div class="tools" id="ex-tools"></div>
      <button class="tool coach-btn" id="listen" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Listen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><rect x="3" y="14" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="14" width="5" height="7" rx="2" fill="currentColor"/></svg><span class="word">Listen</span></button>
      <button class="tool coach-btn" id="try" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Try this" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><span class="word">Try this</span></button>
      <output class="readout" id="readout" aria-live="polite">
        <span class="staff" id="staff"></span>
        <span class="nn" id="nn"></span>
      </output>
      <button class="info" id="info" aria-label="About this instrument" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10.5v6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.2" r="1.5" fill="currentColor"/></svg></button>
    </header>
    <div class="menu" id="menu" role="menu" hidden></div>
    <div class="coach" id="coach" aria-live="polite" hidden></div>
    <div class="tourbar" id="tourbar" hidden></div>
    <div class="stage" id="stage"></div>
  </div>

  <dialog id="placard" class="placard" aria-labelledby="pl-name">
    <div class="card">
      <button class="x" id="placard-close" aria-label="Close">✕</button>
      <div class="pl-top">
        <figure class="art" id="pl-art"></figure>
        <div class="words">
          <p class="fam" id="pl-fam"></p>
          <h2 id="pl-name"></h2>
          <ul id="pl-facts"></ul>
          <dl id="pl-range"></dl>
        </div>
      </div>
      <div class="pl-more" id="pl-more"></div>
    </div>
  </dialog>
</body>
</html>
