  <section class="gate" id="gate" aria-labelledby="gate-q">
    <span class="float" aria-hidden="true">♪</span><span class="float" aria-hidden="true">♫</span><span class="float" aria-hidden="true">♩</span><span class="float" aria-hidden="true">♬</span><span class="float" aria-hidden="true">♪</span><span class="float" aria-hidden="true">♫</span>
    <img class="gate-logo" src="/assets/logo/option-f-notes-badge-icon.svg" alt="" width="150" height="150">
    <p class="gate-name">Mr. Washburn Music</p>
    <h1 id="gate-q">Who’s making music today?</h1>
    <div class="doors">
      <button class="door door-kid" type="button" data-who="kids">
        <span class="door-art" aria-hidden="true"><i class="n n1"></i><i class="n n2"></i><i class="beam"></i></span>
        <span class="door-name">I’m a kid</span>
      </button>
      <button class="door door-grown" type="button" data-who="grownups">
        <span class="door-art" aria-hidden="true"><i class="n n3"></i></span>
        <span class="door-name">I’m a grown-up</span>
      </button>
    </div>
  </section>

  <div class="site" id="site" hidden>
    <header class="top">
      <a class="brand" href="/home/" aria-label="Mr. Washburn Music"><img src="/assets/logo/option-f-notes-badge-icon.svg" alt="" width="44" height="44"><span>Mr. Washburn Music</span></a>
      <div class="top-right">
        <button class="pill" id="sound" type="button" aria-pressed="true">Sound on</button>
        <button class="pill pill-switch" id="switch" type="button"></button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-text">
          <h1 id="headline"></h1>
          <p id="lede"></p>
        </div>
        <div class="photos" id="photos">
          <figure class="photo"><div class="shot shot1"><span>Photo 1</span></div></figure>
          <figure class="photo"><div class="shot shot2"><span>Photo 2</span></div></figure>
          <figure class="photo"><div class="shot shot3"><span>Photo 3</span></div></figure>
          <button class="next" id="next" type="button" aria-label="Next photo"></button>
        </div>
      </section>

      <svg class="waves" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 30 C200 -10 400 70 600 30 S1000 -10 1200 30"/>
        <path d="M0 45 C200 5 400 85 600 45 S1000 5 1200 45"/>
        <path d="M0 60 C200 20 400 100 600 60 S1000 20 1200 60"/>
        <path d="M0 75 C200 35 400 115 600 75 S1000 35 1200 75"/>
        <path d="M0 90 C200 50 400 130 600 90 S1000 50 1200 90"/>
      </svg>

      <section class="menu">
        <div class="menu-head">
          <button class="play" id="play" type="button" aria-label="Play the tune"><i></i></button>
          <div class="sign">More coming soon!</div>
        </div>
        <nav class="staff" id="staff" aria-label="Places to go"></nav>
      </section>
    </main>

    <footer>© 2026 Mr. Washburn Music</footer>
  </div>

  <div class="card" id="card" hidden></div>
</body>
</html>
