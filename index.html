<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr. Washburn Music</title>
  <meta name="description" content="A home for songs, games, lessons, and more for musical learners of all ages. Coming soon.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#F6F1E4">
  <meta property="og:title" content="Mr. Washburn Music">
  <meta property="og:description" content="A home for songs, games, lessons, and more for musical learners of all ages.">
  <style>
    @font-face {
      font-family: "Fredoka";
      src: url("assets/fonts/fredoka-latin.woff2") format("woff2");
      font-weight: 400 600;
      font-display: swap;
    }
    :root {
      --cream: #F6F1E4;
      --forest: #2F4A3A;
      --moss: #5E7D4F;
      --sage: #9DB58C;
      --wheat: #D9B26F;
      --muted: #5B6B5F;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--forest);
      font-family: "Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    main {
      position: relative;
      width: 100%;
      max-width: 960px;
      padding: 56px 16px 32px;
      text-align: center;
      flex: 1;
    }
    .logo {
      width: min(360px, 76%);
      height: auto;
      display: block;
      margin: 0 auto;
      animation: bob 4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-0.6deg); }
      50% { transform: translateY(-8px) rotate(0.6deg); }
    }
    .sign {
      display: inline-block;
      margin: 36px 0 12px;
      padding: 10px 28px 12px;
      background: var(--moss);
      color: var(--cream);
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: 999px;
      box-shadow: 6px 7px 0 var(--wheat);
      transform: rotate(-2deg);
    }
    .lede {
      font-size: clamp(18px, 2.6vw, 22px);
      line-height: 1.5;
      color: var(--muted);
      max-width: 34em;
      text-wrap: balance;
      margin: 18px auto 40px;
    }
    footer {
      width: 100%;
      padding: 24px 16px 32px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }
    footer a { color: var(--forest); }
    .note {
      position: absolute;
      font-size: 34px;
      opacity: 0.22;
      color: var(--moss);
      animation: drift 9s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }
    @media (max-width: 600px) {
      main { padding-top: 36px; }
      .note { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .note { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="note" style="left:2%;top:60px" aria-hidden="true">♪</span>
    <span class="note" style="right:4%;top:120px;animation-delay:-3s" aria-hidden="true">♫</span>
    <span class="note" style="left:8%;top:380px;animation-delay:-5s" aria-hidden="true">♩</span>
    <span class="note" style="right:10%;top:420px;animation-delay:-1.5s" aria-hidden="true">♬</span>

    <h1 style="margin:0"><img class="logo" src="assets/logo/option-c-badge.svg" alt="Mr. Washburn Music"></h1>

    <div class="sign">Coming soon!</div>

    <p class="lede">A home for songs, games, lessons, and more for musical learners of all ages.</p>

  </main>
  <footer>© 2026 Mr. Washburn Music</footer>
</body>
</html>
